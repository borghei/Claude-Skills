name: Publish claude-skills to npm

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Publish with --dry-run (no actual publish)"
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate manifest
        run: python3 scripts/build_manifest.py

      - name: Install CLI deps
        working-directory: cli
        run: npm install --ignore-scripts

      # The CLI test suite was REMOVED from here: `node --test test/*.test.js` runs
      # locally, so running it again on a tag push is duplicated cost and a second
      # source of truth. /ship's local QA gate blocks the release commit — and the
      # `cli-v*` tag that fires this workflow — until it is green.
      #
      # CI deploys and publishes; it does not test. Kept only where a test CANNOT
      # run locally (cross-platform matrices, migration rehearsal, artifact smoke).

      - name: Publish to npm
        working-directory: cli
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
