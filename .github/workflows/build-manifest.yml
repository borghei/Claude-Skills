name: Build skills manifest

on:
  push:
    branches: [main]
    paths:
      # Any skill in any domain, plus the generator itself.
      - "**/SKILL.md"
      - "scripts/build_manifest.py"
  workflow_dispatch:

permissions:
  contents: write

# Back-to-back merges must not race each other on the generated catalogs.
# Queue runs instead of cancelling, so the newest main always gets built.
concurrency:
  group: build-manifest-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate all machine catalogs
        # One run rewrites every catalog so they cannot drift apart:
        # cli/skills.json, registry.json, .gemini/skills-index.json, skills.json
        run: python3 scripts/build_manifest.py

      - name: Commit updated catalogs
        run: |
          CATALOGS="cli/skills.json registry.json .gemini/skills-index.json skills.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The catalogs are generated, so never rebase them: on a rejected push,
          # reset to the new origin/main and regenerate from scratch. A rebase of
          # two regenerated catalogs always conflicts (timestamps, counts).
          for attempt in 1 2 3 4 5; do
            if git diff --quiet -- $CATALOGS; then
              echo "No catalog changes."
              exit 0
            fi
            git add $CATALOGS
            git commit -q -m "chore(cli): regenerate skills manifests [skip ci]"
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); regenerating on top of origin/main…"
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/build_manifest.py
          done
          echo "::error::Could not push catalogs after 5 attempts."
          exit 1
